<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه مدیریت دامداری دامو - تقویم پیش‌بینی زایش</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Vazirmatn', 'sans-serif'] } } } }
    </script>
</head>
<body class="bg-gray-950 font-sans text-gray-100 pb-24 md:pb-12">

    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-amber-400 flex items-center gap-2"><span>📅</span> تقویم پیش‌بینی زایش</h1>
            <a href="dashboard.html" class="text-sm bg-gray-800 text-gray-300 px-3 py-1.5 rounded-xl border border-gray-700">← داشبورد</a>
        </div>
    </header>

    <nav class="hidden md:block bg-gray-900 border-b border-gray-800 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 flex gap-6 text-sm font-medium">
            <a href="dashboard.html" class="py-3.5 text-gray-400 hover:text-amber-400">📊 داشبورد</a>
            <a href="animals.html" class="py-3.5 text-gray-400 hover:text-amber-400">🔍 شناسنامه دام‌ها</a>
            <a href="insemination.html" class="py-3.5 text-gray-400 hover:text-amber-400">💉 ثبت تلقیح</a>
            <a href="calving.html" class="py-3.5 text-gray-400 hover:text-amber-400">🍼 ثبت زایش</a>
            <a href="calendar.html" class="py-3.5 border-b-2 border-amber-500 text-amber-400 font-bold">📅 تقویم پیش‌بینی</a>
            <a href="financial.html" class="py-3.5 text-gray-400 hover:text-amber-400">💰 مالی و حسابداری</a>
            <a href="inventory.html" class="py-3.5 text-gray-400 hover:text-amber-400">📦 انبار غذا و دارو</a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-4 md:p-6 space-y-6">
        
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-sm font-bold text-gray-300 mb-3">جستجوی پلاک دام در پیش‌بینی‌ها</h2>
            <input type="text" id="searchCalendar" placeholder="جستجوی شماره پلاک گاو..." onkeyup="loadCalendar(this.value)" class="w-full px-4 py-3.5 bg-gray-950 border border-gray-800 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none text-gray-100 font-mono" autocomplete="off">
        </div>

        <div id="calendarContainer" class="space-y-4">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 text-center shadow-xl">
                <div class="text-5xl mb-3">🗓️</div>
                <h3 class="text-base font-bold text-gray-200">در حال دریافت و محاسبه تقویم زایش...</h3>
            </div>
        </div>

    </main>

    <nav class="bg-gray-900 border-t border-gray-800 fixed bottom-0 left-0 right-0 z-50 md:hidden shadow-lg">
        <div class="flex justify-around items-center h-16 text-xs">
            <a href="dashboard.html" class="flex flex-col items-center text-gray-400">📊 داشبورد</a>
            <a href="animals.html" class="flex flex-col items-center text-gray-400">🔍 شناسنامه</a>
            <a href="insemination.html" class="flex flex-col items-center text-gray-400">💉 تلقیح</a>
            <a href="calving.html" class="flex flex-col items-center text-gray-400">🐄 زایش</a>
            <a href="calendar.html" class="flex flex-col items-center text-amber-400 font-bold">📅 تقویم</a>
        </div>
    </nav>

    <script>
        const SUPABASE_URL = "https://zjxnevkuiyawlkqawcsv.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpqeG5ldmt1aXlhd2xrcWF3Y3N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMDY2NDEsImV4cCI6MjEwMzY4MjY0MX0.6xdeTJuy-D6dFnSj9lhFM0-lPAoVYv72czplKdY6rs4";
        
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadCalendar(search = '') {
            let query = dbClient.from('inseminations').select('*').order('id', { ascending: false });
            if (search) query = query.ilike('tag_number', `%${search}%`);

            const { data, error } = await query;
            const container = document.getElementById('calendarContainer');

            if (error) {
                container.innerHTML = `<div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 text-center shadow-xl"><h3 class="text-base font-bold text-red-400">خطا در بارگذاری: ${error.message}</h3></div>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 text-center shadow-xl">
                        <div class="text-5xl mb-3">🗓️</div>
                        <h3 class="text-base font-bold text-gray-200">هیچ رکورد تلقیحی یافت نشد.</h3>
                    </div>`;
                return;
            }

            container.innerHTML = data.map(item => {
                let insDate = new Date(item.insemination_date);
                let dueDate = !isNaN(insDate) ? new Date(insDate.setDate(insDate.getDate() + 280)).toISOString().split('T')[0] : 'محاسبه‌نشده';

                return `
                    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <span class="text-xs bg-amber-950 text-amber-300 px-3 py-1 rounded-lg font-mono">پلاک دام: ${item.tag_number}</span>
                            <h4 class="text-base font-bold text-gray-100 mt-2">کد اسپرم: ${item.semen_code || 'نامشخص'}</h4>
                            <p class="text-xs text-gray-400 mt-1">تاریخ تلقیح: <span class="font-mono text-gray-300">${item.insemination_date}</span></p>
                        </div>
                        <div class="text-left bg-gray-950 px-4 py-3 rounded-xl border border-gray-800 w-full sm:w-auto">
                            <span class="text-xs text-amber-400 block font-medium">تاریخ پیش‌بینی شده زایش:</span>
                            <span class="text-lg font-bold font-mono text-gray-100">${dueDate}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        loadCalendar();
    </script>
</body>
</html>
