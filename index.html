<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه مدیریت دامداری دامو - ورود / ثبت‌نام</title>
    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- کتابخانه رسمی Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Vazirmatn', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-950 font-sans text-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
        
        <!-- لوگو و عنوان -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-950 border border-emerald-800/50 rounded-2xl text-3xl mb-3 shadow-inner">
                🐄
            </div>
            <h1 class="text-2xl font-bold text-emerald-400">سامانه مدیریت «دامو»</h1>
            <p class="text-xs text-gray-400 mt-1">مدیریت هوشمند و جامع گاوداری و فارم</p>
        </div>

        <!-- دکمه‌های تب (سوئیچ) -->
        <div class="flex bg-gray-950 p-1 rounded-2xl border border-gray-800 mb-6">
            <button type="button" id="tab-login" onclick="
                document.getElementById('box-login').style.display = 'block';
                document.getElementById('box-register').style.display = 'none';
                this.className = 'flex-1 py-2.5 text-sm font-bold rounded-xl transition-all duration-200 text-emerald-400 bg-gray-900 shadow';
                document.getElementById('tab-register').className = 'flex-1 py-2.5 text-sm font-bold rounded-xl transition-all duration-200 text-gray-400 hover:text-gray-200';
            " class="flex-1 py-2.5 text-sm font-bold rounded-xl transition-all duration-200 text-emerald-400 bg-gray-900 shadow">
                ورود به حساب
            </button>
            <button type="button" id="tab-register" onclick="
                document.getElementById('box-login').style.display = 'none';
                document.getElementById('box-register').style.display = 'block';
                this.className = 'flex-1 py-2.5 text-sm font-bold rounded-xl transition-all duration-200 text-emerald-400 bg-gray-900 shadow';
                document.getElementById('tab-login').className = 'flex-1 py-2.5 text-sm font-bold rounded-xl transition-all duration-200 text-gray-400 hover:text-gray-200';
            " class="flex-1 py-2.5 text-sm font-bold rounded-xl transition-all duration-200 text-gray-400 hover:text-gray-200">
                ثبت‌نام فارم جدید
            </button>
        </div>

        <!-- ۱. بخش فرم ورود -->
        <div id="box-login">
            <form id="loginForm" class="space-y-4" autocomplete="off">
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1.5">شماره موبایل <span class="text-red-400">*</span></label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-500">📞</span>
                        <input type="tel" id="loginPhone" required autocomplete="off" placeholder="مثلاً 09123456789" class="w-full pr-10 pl-4 py-3 bg-gray-950 border border-gray-800 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm text-gray-100 transition font-mono">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1.5">رمز عبور <span class="text-red-400">*</span></label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-500">🔒</span>
                        <input type="password" id="loginPassword" required autocomplete="new-password" placeholder="••••••••" class="w-full pr-10 pl-4 py-3 bg-gray-950 border border-gray-800 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm text-gray-100 transition">
                    </div>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 text-sm mt-2">
                    <span>🔑</span> ورود به برنامه
                </button>
            </form>
        </div>

        <!-- ۲. بخش فرم ثبت‌نام -->
        <div id="box-register" style="display: none;">
            <form id="registerForm" class="space-y-4" autocomplete="off">
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1.5">نام و نام خانوادگی مدیر فارم <span class="text-red-400">*</span></label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-500">👤</span>
                        <input type="text" id="regName" required autocomplete="off" placeholder="مثلاً محمد حسین مرادی" class="w-full pr-10 pl-4 py-3 bg-gray-950 border border-gray-800 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm text-gray-100 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1.5">نام دامداری / فارم <span class="text-red-400">*</span></label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-500">🏡</span>
                        <input type="text" id="regFarmName" required autocomplete="off" placeholder="مثلاً گاوداری صنعتی دامو" class="w-full pr-10 pl-4 py-3 bg-gray-950 border border-gray-800 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm text-gray-100 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1.5">شماره موبایل <span class="text-red-400">*</span></label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-500">📞</span>
                        <input type="tel" id="regPhone" required autocomplete="off" placeholder="مثلاً 09123456789" class="w-full pr-10 pl-4 py-3 bg-gray-950 border border-gray-800 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm text-gray-100 transition font-mono">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1.5">ایمیل <span class="text-red-400">*</span></label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-500">📧</span>
                        <input type="email" id="regEmail" required autocomplete="off" placeholder="name@example.com" class="w-full pr-10 pl-4 py-3 bg-gray-950 border border-gray-800 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm text-gray-100 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1.5">تعیین رمز عبور <span class="text-red-400">*</span></label>
                    <div class="relative">
                        <span class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-500">🔒</span>
                        <input type="password" id="regPassword" required autocomplete="new-password" placeholder="حداقل ۶ کاراکتر" class="w-full pr-10 pl-4 py-3 bg-gray-950 border border-gray-800 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-sm text-gray-100 transition">
                    </div>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 text-sm mt-2">
                    <span>✨</span> ایجاد حساب و ورود به سامانه
                </button>
            </form>
        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://zjxnevkuiyawlkqawcsv.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpqeG5ldmt1aXlhd2xrcWF3Y3N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMDY2NDEsImV4cCI6MjEwMzY4MjY0MX0.6xdeTJuy-D6dFnSj9lhFM0-lPAoVYv72czplKdY6rs4";
        
        const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ثبت‌نام در دیتابیس Supabase و هدایت به داشبورد
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const manager_name = document.getElementById('regName').value.trim();
            const farm_name = document.getElementById('regFarmName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password_hash = document.getElementById('regPassword').value.trim();

            const { data, error } = await dbClient
                .from('farms')
                .insert([{ manager_name, farm_name, phone, email, password_hash }]);

            if (error) {
                alert('خطا در ثبت‌نام: ' + error.message);
            } else {
                localStorage.setItem('damou_logged_user_phone', phone);
                window.location.href = 'dashboard.html';
            }
        });

        // ورود به سیستم و هدایت به داشبورد یا پنل ادمین
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            
            // شماره و رمز عبور اختصاصی ادمین کل
            const ADMIN_PHONE = "09031813270";
            const ADMIN_PASS = "M09031813270m";

            if (phone === ADMIN_PHONE && password === ADMIN_PASS) {
                localStorage.setItem('damou_is_admin', 'true');
                window.location.href = 'admin_dashboard.html';
                return;
            }

            const { data, error } = await dbClient
                .from('farms')
                .select('*')
                .eq('phone', phone)
                .eq('password_hash', password)
                .maybeSingle();

            if (error || !data) {
                alert('شماره موبایل یا رمز عبور اشتباه است. اگر حساب ندارید لطفاً از بخش ثبت‌نام اقدام کنید.');
            } else {
                localStorage.setItem('damou_logged_user_phone', phone);
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
